<!doctype html>
<html lang="en" class="dark" data-theme="warm-obsidian-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ShiftSync AI</title>
    <meta name="description" content="Desktop-first 24/7 workforce scheduling and operations web application with precision HUD, orbital chrono-ring, explainable AI autopilot, and publication gates." />
    <meta property="og:title" content="ShiftSync AI" />
    <meta property="og:description" content="Desktop-first 24/7 workforce scheduling and operations web application with precision HUD, orbital chrono-ring, explainable AI autopilot, and publication gates." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #07090E;
        color: #F1F5F9;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        font-variant-numeric: tabular-nums;
      }
    </style>
    <script>
      // Auto-recover once if Vite optimized dependencies changed while HMR is disabled
      window.addEventListener('vite:preloadError', function () {
        try {
          if (!sessionStorage.getItem('shiftsync_chunk_reload')) {
            sessionStorage.setItem('shiftsync_chunk_reload', '1');
            window.location.reload();
          }
        } catch (_e) {
          window.location.reload();
        }
      });
      window.addEventListener(
        'error',
        function (e) {
          var target = e && e.target;
          if (target && target.tagName === 'SCRIPT' && target.src) {
            try {
              if (!sessionStorage.getItem('shiftsync_script_reload')) {
                sessionStorage.setItem('shiftsync_script_reload', '1');
                window.location.reload();
              }
            } catch (_err) {}
          }
        },
        true
      );
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
          <div style="width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #065f46, #047857); color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; box-shadow: 0 8px 24px rgba(6, 95, 70, 0.28);">
            SS
          </div>
          <div style="font-size: 13px; color: #57635d; font-weight: 500;">
            Loading ShiftSync workspace...
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
