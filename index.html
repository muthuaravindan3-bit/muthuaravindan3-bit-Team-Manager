<!doctype html>
<html lang="en" class="dark" data-theme="warm-obsidian-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Team Manager</title>
    <meta name="description" content="Simple team management for staff schedules, leave requests, and smart help tracking." />
    <meta property="og:title" content="Team Manager" />
    <meta property="og:description" content="Simple team management for staff schedules, leave requests, and smart help tracking." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #070d0b;
        color: #f4f7f5;
        font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      html[data-theme="warm-obsidian-light"], html.light,
      html[data-theme="warm-obsidian-light"] body, html.light body {
        background-color: #faf8f4;
        color: #141a17;
      }
    </style>
    <script>
      // Auto-recover once if Vite optimized dependencies changed while HMR is disabled
      window.addEventListener('vite:preloadError', function () {
        try {
          if (!sessionStorage.getItem('shiftsync_chunk_reload')) {
            sessionStorage.setItem('shiftsync_chunk_reload', '1');
            window.location.reload();
          }
        } catch (_e) {
          window.location.reload();
        }
      });
      window.addEventListener(
        'error',
        function (e) {
          var target = e && e.target;
          if (target && target.tagName === 'SCRIPT' && target.src) {
            try {
              if (!sessionStorage.getItem('shiftsync_script_reload')) {
                sessionStorage.setItem('shiftsync_script_reload', '1');
                window.location.reload();
              }
            } catch (_err) {}
          }
        },
        true
      );
    </script>
  </head>
  <body>
    <div id="root">
      <div data-boot-placeholder style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
          <div style="width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #065f46, #047857); color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; box-shadow: 0 8px 24px rgba(6, 95, 70, 0.28);">
            SS
          </div>
          <div style="font-size: 13px; color: #57635d; font-weight: 500;">
            Loading ShiftSync workspace...
          </div>
        </div>
      </div>
    </div>
    <script>
      // Recover even when an entry-module request never reaches React.
      setTimeout(function () {
        var placeholder = document.querySelector('[data-boot-placeholder]');
        if (!placeholder) return;
        var content = placeholder.firstElementChild;
        content.textContent = '';
        var title = document.createElement('h1');
        title.textContent = 'The app could not finish loading';
        title.style.fontSize = '22px';
        var message = document.createElement('p');
        message.textContent = 'Check your connection, then reload ShiftSync.';
        var button = document.createElement('button');
        button.textContent = 'Reload ShiftSync';
        button.style.cssText = 'min-height:44px;padding:12px 20px;border-radius:8px;border:1px solid currentColor;cursor:pointer;font:inherit';
        button.onclick = function () { window.location.reload(); };
        content.setAttribute('role', 'alert');
        content.append(title, message, button);
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
